{% extends 'auth_base.html' %}
{% load static %}

{% block title %}Login | Nyondo Hardware{% endblock %}

{% block content %}

<style>
    .login-title {
        text-align: center;
        color: #d97706;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .login-subtitle {
        text-align: center;
        color: #4b2e05;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .form-label {
        font-weight: 600;
        color: #4b2e05;
    }

    .form-control {
        border-radius: 8px;
        padding: 10px;
    }

    .btn-login {
        background-color: #d97706;
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 8px;
        padding: 10px;
        width: 100%;
    }

    .btn-login:hover {
        background-color: #b45309;
        color: white;
    }

    .auth-small {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
        color: #8b5e3c;
    }

    .register-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }

    .register-link a {
        color: #d97706;
        font-weight: bold;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }
</style>

<h2 class="login-title">
    NYONDO HARDWARE
</h2>

<p class="login-subtitle">
    Construction & Building Materials System
</p>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Username</label>
        <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter username"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter password"
            required
        >
    </div>

    <button type="submit" class="btn btn-login">
        Login
    </button>
</form>

<div class="register-link">
    Don’t have an account?
    <a href="{% url 'register' %}">Register here</a>
</div>

<div class="auth-small">
    Authorized Staff Only • Nansana Uganda
</div>

{% endblock %}
