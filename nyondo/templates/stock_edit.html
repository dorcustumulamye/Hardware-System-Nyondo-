{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm p-4">

        <h2 class="mb-4">Edit Stock</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Supplier</label>
                <input type="text" name="supplier" class="form-control" value="{{ stock.supplier }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" value="{{ stock.category }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="product_name" class="form-control" value="{{ stock.product_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity Delivered</label>
                <input type="number" name="quantity_delivered" class="form-control" value="{{ stock.quantity_delivered }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Unit Cost</label>
                <input type="number" step="0.01" name="unit_cost" class="form-control" value="{{ stock.unit_cost }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Selling Price</label>
                <input type="number" step="0.01" name="unit_price" class="form-control" value="{{ stock.unit_price }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Supplier Payment Status</label>
                <select name="supplier_payment_status" class="form-control" required>
                    <option value="paid" {% if stock.supplier_payment_status == "paid" %}selected{% endif %}>Paid</option>
                    <option value="not_paid" {% if stock.supplier_payment_status == "not_paid" %}selected{% endif %}>Not Paid</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Payment Type</label>
                <select name="payment_type" class="form-control" required>
                    <option value="cash" {% if stock.payment_type == "cash" %}selected{% endif %}>Cash</option>
                    <option value="mobile_money" {% if stock.payment_type == "mobile_money" %}selected{% endif %}>Mobile Money</option>
                    <option value="bank" {% if stock.payment_type == "bank" %}selected{% endif %}>Bank</option>
                    <option value="credit" {% if stock.payment_type == "credit" %}selected{% endif %}>Credit</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success px-5">
                    Update Stock
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
